<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d185e"/>
      <stop offset="50%" stop-color="#240c3c"/>
      <stop offset="100%" stop-color="#140622"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8a3ffc" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Phone frame outline with 9:16 aspect -->
  <rect x="140" y="70" width="232" height="372" rx="28" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="10" filter="url(#glow)"/>

  <!-- Header pill inside phone -->
  <rect x="165" y="100" width="182" height="34" rx="12" fill="none" stroke="#ffffff" stroke-width="5"/>
  <text x="256" y="123" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">AVISO UPL</text>

  <!-- Central Eagle / Lightning motif -->
  <path d="M 210,210 L 290,210 L 240,270 L 300,270 L 220,350 L 245,290 L 195,290 Z" fill="url(#gold)"/>

  <!-- Subtitle pill at bottom -->
  <circle cx="256" cy="415" r="8" fill="rgba(255,255,255,0.5)"/>
</svg>
